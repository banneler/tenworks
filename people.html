<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenWorks People</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="icon" href="assets/icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="assets/icon-180.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .people-layout { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start; }
        .people-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .people-toolbar .form-control { min-width: 0; }
        .people-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .people-list { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 220px); overflow: auto; }
        .people-card { text-align: left; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; color: inherit; cursor: pointer; }
        .people-card.selected { border-color: var(--primary-blue); }
        .people-card-title { font-weight: 600; color: var(--text-bright); }
        .people-card-meta { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }
        .people-inactive { color: var(--danger-red); }
        .people-drawer { background: var(--bg-medium, var(--bg-dark)); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
        .people-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
        .people-grid .wide { grid-column: 1 / -1; }
        .people-section { margin-top: 18px; }
        .people-section h3 { margin: 0 0 8px; font-size: 1rem; }
        .people-skill, .people-history, .people-pto { display: grid; grid-template-columns: 1.4fr 0.7fr auto 0.9fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
        .people-history, .people-pto { grid-template-columns: 1fr 1fr 1fr auto; }
        .people-note { color: var(--text-dim); font-size: 0.85rem; }
        @media (max-width: 900px) {
            .people-layout { grid-template-columns: 1fr; }
            .people-grid, .people-skill { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="theme-dark" data-nav="erp">
    <div id="global-loader-overlay" class="global-loader-overlay active" aria-live="polite" aria-busy="true">
        <div class="global-loader-content">
            <div class="global-loader-spinner" aria-hidden="true">
                <img src="assets/logo.svg" alt="" class="global-loader-logo-spin" width="80" height="80">
            </div>
            <p class="global-loader-text">Loading…</p>
        </div>
    </div>
    <div class="crm-container">
        <nav class="nav-sidebar" id="nav-container"><script>(function(){try{if(localStorage.getItem('crm-nav-collapsed')==='1')document.getElementById('nav-container').classList.add('nav-sidebar-collapsed');}catch(e){}})();</script></nav>
        <main class="content-area">
            <div class="header-action-area" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h1 class="page-title">People</h1>
                <div style="display:flex;gap:8px;">
                    <button type="button" id="people-add" class="btn-primary"><i class="fas fa-plus"></i> Add person</button>
                    <button type="button" id="people-refresh" class="btn-secondary"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>
            <div class="people-tabs">
                <button type="button" class="btn-primary" id="tab-crew">Crew</button>
                <button type="button" class="btn-secondary" id="tab-trades">Trades</button>
            </div>
            <div id="crew-view" class="people-layout">
                <section>
                    <div class="people-toolbar">
                        <input id="people-search" class="form-control" type="search" placeholder="Search crew" style="flex:1;">
                        <select id="people-trade-filter" class="form-control"><option value="">All trades</option></select>
                        <label style="display:flex;align-items:center;gap:6px;color:var(--text-medium);"><input type="checkbox" id="people-show-inactive"> Inactive</label>
                    </div>
                    <div id="people-list" class="people-list"></div>
                </section>
                <aside id="people-drawer" class="people-drawer">
                    <p class="people-note">Select a person to see their profile, skills, rates, and time off.</p>
                </aside>
            </div>
            <div id="trades-view" class="hidden">
                <div id="trades-list" class="people-list"></div>
            </div>
        </main>
    </div>
    <div id="modal-backdrop" class="modal-backdrop hidden">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <div id="modal-body"></div>
            <div id="modal-actions" class="modal-actions"></div>
        </div>
    </div>
    <script type="module" src="js/people.js"></script>
</body>
</html>
